<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>קפה לילה — קונספט</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@300;400;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#F5EEDF;color:#2F3A2A;font-family:Assistant,sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:26px 6vw}
.logo{font:400 30px 'Suez One',serif;color:#4E6B3A}.logo small{font:600 12px Assistant;color:#9A8B6E;margin-right:8px}
.links{display:flex;gap:30px;font-size:16px;font-weight:600}
.order{background:#4E6B3A;color:#F5EEDF;padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px}
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:5vw;align-items:center;padding:3vw 6vw 5vw;min-height:calc(100vh - 92px)}
.chip{display:inline-block;background:#E5D9BF;color:#6B5B3B;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px}
h1{font:400 clamp(46px,6vw,92px)/1.05 'Suez One',serif;margin-top:22px;color:#2F3A2A}h1 span{color:#B4602F}
p{font-size:20px;line-height:1.65;color:#5A5546;margin-top:22px;max-width:28em}
.cta{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.cta a{padding:17px 28px;border-radius:999px;font-weight:700;font-size:16px}
.a1{background:#B4602F;color:#fff}.a2{border:2px solid #2F3A2A}
.menu{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}.menu span{border:1.5px solid #CDBE9C;padding:8px 14px;border-radius:12px;font-size:15px}
.photo{position:relative;height:min(74vh,640px);border-radius:220px 220px 24px 24px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(47,58,42,.5)}
.photo img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;bottom:26px;right:26px;background:#F5EEDF;padding:14px 18px;border-radius:16px;font-weight:700;font-size:15px}.badge small{display:block;font-weight:400;color:#6B5B3B}
@media(max-width:800px){.links{display:none}.hero{grid-template-columns:1fr}.photo{height:46vh;order:-1;border-radius:160px 160px 20px 20px}}
</style></head><body>
<nav><span class="logo">קפה לילה<small>בית קפה שכונתי</small></span><div class="links"><span>תפריט</span><span>ארוחות בוקר</span><span>אירועים</span><span>הגעה</span></div><span class="order">להזמנת מקום</span></nav>
<section class="hero">
<div>
<span class="chip">☕ פתוח עכשיו · עד 23:00</span>
<h1>הבוקר הכי טוב <span>בשכונה</span>.</h1>
<p>קפה קלוי במקום, מאפים מהתנור וארוחות בוקר עד הצהריים. בואו לשבת, לעבוד או סתם להתעכב עוד קצת.</p>
<div class="cta"><a class="a1">לתפריט המלא</a><a class="a2">משלוח עד הבית</a></div>
<div class="menu"><span>אספרסו 12 ₪</span><span>שקשוקה 52 ₪</span><span>קרואסון שקדים 18 ₪</span></div>
</div>
<div class="photo"><img src="cafe.jpg" alt=""><div class="badge">7 ימים בשבוע<small>מ־07:00 בבוקר</small></div></div>
</section></body></html>
